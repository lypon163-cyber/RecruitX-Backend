services:
  db:
    # 直接指定国内加速镜像地址，不需要 Docker 软件去加速了
    image: docker.1ms.run/library/mysql:8.0
    container_name: recruitx_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: recruitx_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: